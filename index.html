<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多帳戶鬧鐘與職位助手</title>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        /* 只載入你最喜歡的兩款神仙字體：貓啃什錦黑 & jf粉圓體 */
        @font-face {
            font-family: 'MaokenFont';
            src: url('./MaokenAssortedSans-TC.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'HuninnFont';
            src: url('./jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            /* San-X 療癒可可棕主色調 */
            --cocoa: #5C3D2E;
            --cocoa-light: #8C6A58;
            --cream-bg: #FFFDF8;

            /* Zoey（主號）：蜂蜜布丁黃 (鬆弛熊) */
            --bg-z: rgba(255, 249, 224, 0.95);
            --border-z: #F7D774;
            --card-z: linear-gradient(135deg, #F7B733 0%, #E69A15 100%);
            --shadow-z: rgba(230, 154, 21, 0.25);

            /* Howard：草莓櫻花粉 (小白熊) */
            --bg-h: rgba(255, 240, 244, 0.95);
            --border-h: #F8B4C8;
            --card-h: linear-gradient(135deg, #FF7EA5 0%, #EB5A87 100%);
            --shadow-h: rgba(235, 90, 135, 0.25);

            /* Patrick：清新抹茶薄荷綠 (茶小熊) */
            --bg-p: rgba(236, 250, 240, 0.95);
            --border-p: #9CE0B4;
            --card-p: linear-gradient(135deg, #58C984 0%, #38A866 100%);
            --shadow-p: rgba(56, 168, 102, 0.25);

            /* 標題：貓啃什錦黑（可切換粉圓體）；內文與計時：統一 jf粉圓體 */
            --font-title: 'MaokenFont', 'HuninnFont', "PingFang HK", sans-serif;
            --font-body: 'HuninnFont', -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* 全頁彩色手繪蠟筆圓點背景 (bg_dot_2.jpg) */
        body {
            font-family: var(--font-body);
            background-color: var(--cream-bg);
            background-image: url('./bg_dot_2.jpg');
            background-repeat: repeat;
            background-size: 280px 280px;
            margin: 0;
            padding: 28px 36px 130px 36px;
            color: var(--cocoa);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button, select, input {
            font-family: var(--font-body);
            color: var(--cocoa);
        }

        /* 頁面最上方雙色黃波浪花邊 (bg_frill.png) */
        .header-frill {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background-image: url('./bg_frill.png');
            background-repeat: repeat-x;
            background-position: top center;
            background-size: 64px 16px;
            pointer-events: none;
            z-index: 10;
        }

        /* 日本官網同款 SHAKI!! 熱鬆餅開場動畫遮罩 */
        .loading-splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #FFF066;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        .loading-splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-stage {
            position: relative;
            width: 240px;
            height: 240px;
        }
        .loading-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .loading-frame.frame-1 { opacity: 1; }
        .loading-frame.frame-2 { opacity: 0; }
        .loading-splash.shaki .loading-frame.frame-1 { opacity: 0; }
        .loading-splash.shaki .loading-frame.frame-2 {
            opacity: 1;
            animation: shakiPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .loading-text {
            font-family: var(--font-title);
            font-size: 20px;
            letter-spacing: 3px;
            color: var(--cocoa);
            margin-top: 8px;
        }

        /* 頂部可愛橫幅列 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1240px;
            margin: 0 auto 22px auto;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2.5px solid #F2DFC4;
            border-radius: 26px;
            box-shadow: 0 6px 20px rgba(92, 61, 46, 0.08);
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            z-index: 5;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-mascot-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(92, 61, 46, 0.16));
            animation: gentleFloat 3s ease-in-out infinite;
        }

        h1 {
            font-family: var(--font-title);
            font-weight: normal;
            font-size: 27px;
            margin: 0;
            letter-spacing: 1px;
            color: var(--cocoa);
        }

        .sync-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            background: #F5EFE6;
            color: var(--cocoa-light);
            border: 1.5px dashed #DECBB7;
        }
        .sync-badge.connected {
            background: #E8F8EC;
            color: #26733A;
            border-color: #A3DFB3;
        }
        .sync-badge.error {
            background: #FDECEA;
            color: #A62626;
            border-color: #F5B7B1;
        }

        .header-btns {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        /* 糖果膠囊按鈕 */
        .pill-btn {
            border: 2px solid #FFF;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12.5px;
            color: #FFF;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 8px rgba(92, 61, 46, 0.14);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
        }
        .pill-btn:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.04);
        }
        .pill-btn:active {
            transform: scale(0.97);
        }

        .btn-icon-svg {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .btn-refresh-profile { background: linear-gradient(135deg, #5CD685, #38B864); }
        .btn-refresh-profile:disabled { opacity: 0.65; cursor: wait; }
        .btn-font-title { background: linear-gradient(135deg, #C07CEB, #A155D4); }
        .btn-pancake { background: linear-gradient(135deg, #F7B733, #E69A15); }
        .btn-test { background: linear-gradient(135deg, #FF9966, #F27935); }
        .btn-event-toggle { background: #B8A99A; }
        .btn-event-toggle.active { background: linear-gradient(135deg, #FF85A1, #EB5A87); }
        .btn-toggle { background: linear-gradient(135deg, #5AA9FF, #3B88E8); }

        /* 3欄手賬卡片視圖 */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            max-width: 1240px;
            margin: 0 auto;
            position: relative;
            z-index: 4;
        }

        .account-column {
            border-radius: 26px;
            padding: 16px 16px 22px 16px;
            border: 3.5px solid #FFFFFF;
            box-shadow: 0 10px 24px rgba(92, 61, 46, 0.09);
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            overflow: visible;
        }

        /* 內層虛線手賬縫邊 */
        .account-column::before {
            content: "";
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 20px;
            border: 1.5px dashed rgba(92, 61, 46, 0.18);
            pointer-events: none;
        }

        .account-column.z { background-color: var(--bg-z); outline: 2px solid var(--border-z); }
        .account-column.h { background-color: var(--bg-h); outline: 2px solid var(--border-h); }
        .account-column.p { background-color: var(--bg-p); outline: 2px solid var(--border-p); }

        /* 公仔直接站在欄位「框外角」，完全不進框內、不擋任何職位空間 */
        .outer-corner-stand {
            position: absolute;
            bottom: -24px;
            right: -34px;
            width: 84px;
            height: 84px;
            object-fit: contain;
            pointer-events: none;
            z-index: 8;
            filter: drop-shadow(0 4px 7px rgba(92, 61, 46, 0.24));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .account-column:hover .outer-corner-stand {
            transform: translateY(-4px) rotate(-4deg) scale(1.06);
        }

        /* 遊戲角色名片貼紙 */
        .profile-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            padding: 13px 14px;
            display: flex;
            align-items: center;
            gap: 13px;
            border: 2px solid rgba(92, 61, 46, 0.08);
            box-shadow: 0 4px 12px rgba(92, 61, 46, 0.06);
            position: relative;
            z-index: 2;
        }

        .profile-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            object-fit: cover;
            background: #F5EFE6;
            border: 2.5px solid #FFF;
            box-shadow: 0 3px 8px rgba(92, 61, 46, 0.15);
            display: block;
        }

        .avatar-chara-badge {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 30px;
            height: 30px;
            object-fit: contain;
            background: #FFF;
            border-radius: 50%;
            padding: 2px;
            box-shadow: 0 2px 5px rgba(92, 61, 46, 0.22);
        }

        .profile-details {
            flex: 1;
            min-width: 0;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .profile-name {
            font-family: var(--font-title);
            font-weight: normal;
            font-size: 27px;
            color: var(--cocoa);
            line-height: 1.15;
            letter-spacing: 0.5px;
        }

        .main-crown-badge {
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 999px;
            background: linear-gradient(135deg, #FFD43B, #FAB005);
            color: var(--cocoa);
            border: 1px solid #FFF;
            box-shadow: 0 2px 4px rgba(92, 61, 46, 0.12);
        }

        .profile-alliance {
            font-size: 12px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 999px;
            background: var(--cocoa);
            color: #FFFDF6;
        }

        .profile-stats-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 6px;
            flex-wrap: wrap;
            font-size: 13.5px;
            font-weight: 700;
        }

        .stat-pill {
            padding: 3px 11px;
            border-radius: 999px;
        }
        .stat-pill.tg {
            background: #FFF3D6;
            color: #9C5A00;
            border: 1px solid #F7D774;
        }
        .stat-pill.power {
            background: #FFF0F4;
            color: #B8325A;
            border: 1px solid #F8B4C8;
        }

        .btn-edit-profile {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #FAF4EB;
            border: 1px solid #EADBC8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn-edit-profile:hover { opacity: 1; transform: scale(1.1); }

        .section-block {
            position: relative;
            z-index: 2;
        }

        .section-header {
            font-family: var(--font-title);
            font-weight: normal;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 21px;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            color: var(--cocoa);
            padding: 0 2px;
        }

        .btn-add {
            background: #5CD685;
            color: white;
            border: 2px solid #FFF;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(92, 61, 46, 0.15);
            transition: transform 0.2s;
        }
        .btn-add:hover { transform: scale(1.15); }

        /* 計時卡片列：已開始的計時卡片旁顯示小花朵編號（1, 2...） */
        .timer-item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .flower-seq-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            background-image: url('./bg_epi_num.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 800;
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(92, 61, 46, 0.45);
            filter: drop-shadow(0 2px 4px rgba(92, 61, 46, 0.15));
        }

        /* 軟萌計時小卡片 */
        .timer-card {
            flex: 1;
            min-width: 0;
            color: white;
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            position: relative;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .timer-card:hover {
            transform: translateY(-2px);
        }

        .z .timer-card { background: var(--card-z); box-shadow: 0 4px 12px var(--shadow-z); }
        .h .timer-card { background: var(--card-h); box-shadow: 0 4px 12px var(--shadow-h); }
        .p .timer-card { background: var(--card-p); box-shadow: 0 4px 12px var(--shadow-p); }

        .timer-card.master-card {
            border-left: 6px solid #FFF3A1;
        }
        .timer-card.sunlight-card {
            background: linear-gradient(135deg, #FFA24C 0%, #FF6F61 100%) !important;
            box-shadow: 0 4px 12px rgba(255, 111, 97, 0.28) !important;
            border-left: 6px solid #FFF6D6;
        }

        .timer-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 6px;
        }

        .timer-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .timer-display {
            font-size: 21px;
            font-weight: 700;
            font-family: var(--font-body);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(92, 61, 46, 0.22);
            line-height: 1.2;
        }

        .timer-sub {
            font-size: 11px;
            opacity: 0.94;
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
        }

        .time-input {
            width: 26px;
            height: 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.96);
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            font-family: var(--font-body);
            color: var(--cocoa);
            padding: 0;
        }

        .timer-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.28);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn-action:hover { background: rgba(255, 255, 255, 0.45); }

        .btn-del {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            cursor: pointer;
            padding: 0 3px;
        }
        .btn-del:hover { color: white; }

        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.5);
        }

        .btn-preset {
            background: rgba(92, 61, 46, 0.22);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-preset:hover {
            background: rgba(255, 255, 255, 0.38);
        }

        /* 職位預約白卡：標題維持原本大小（18px），只放大框「內」文字與下拉選單 */
        .job-section {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            padding: 13px 14px 15px 14px;
            display: flex;
            flex-direction: column;
            gap: 11px;
            border: 2px solid rgba(92, 61, 46, 0.08);
            box-shadow: 0 4px 10px rgba(92, 61, 46, 0.05);
            position: relative;
            z-index: 2;
        }

        .job-section-title {
            font-family: var(--font-title);
            font-weight: normal;
            font-size: 18px;
            border-bottom: 1.5px dashed #E6D7C3;
            padding-bottom: 5px;
            color: var(--cocoa);
        }

        .job-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16.5px;
            font-weight: 700;
            color: var(--cocoa);
            gap: 6px;
        }

        .btn-shift {
            background: #FFA24C;
            color: white;
            border: none;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 4px;
        }
        .btn-shift:hover { background: #EB8931; }

        select {
            padding: 5px 11px;
            border-radius: 999px;
            border: 1.5px solid #DFCBB5;
            background: #FFFDF9;
            font-size: 15px;
            font-weight: 700;
            color: var(--cocoa);
        }

        /* 打直獨立拆分欄位視圖 */
        .timeline-view {
            display: none;
            max-width: 1240px;
            margin: 0 auto;
            position: relative;
            z-index: 4;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .timeline-column {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 16px;
            border: 2.5px solid #F0DFC8;
            box-shadow: 0 6px 18px rgba(92, 61, 46, 0.07);
        }

        .timeline-column h3 {
            font-family: var(--font-title);
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 19px;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px dashed #EFE2D0;
            color: var(--cocoa);
        }

        .timeline-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 9px;
            border-radius: 14px;
            border-left: 6px solid;
            font-weight: 600;
            font-size: 13.5px;
            color: var(--cocoa);
        }

        .timeline-item.z { background-color: var(--bg-z); border-color: var(--border-z); }
        .timeline-item.h { background-color: var(--bg-h); border-color: var(--border-h); }
        .timeline-item.p { background-color: var(--bg-p); border-color: var(--border-p); }

        .tag {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            color: white;
            margin-left: 4px;
        }
        .tag-soldier { background: #FF9F43; }
        .tag-tech { background: #7D83EB; }
        .tag-master { background: #5CD685; }
        .tag-sunlight { background: #FF6F61; }
        .tag-job-s { background: #EB5A87; }
        .tag-job-t { background: #5299E8; }

/* 頁尾單獨 1 個大雲朵 (bg_cloud_pc.png) */
.footer-clouds {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 180px; /* 先把高度放寬，避免雲朵上半部被裁切 */
    background-image: url('./bg_cloud_pc.png');
    background-repeat: no-repeat;
    background-position: bottom center;
    background-size: contain; /* 完整顯示整張圖片，不會被切掉 */
    pointer-events: none;
    z-index: 6; /* 調到卡片上方（原本是 1，被中間欄位擋住了） */
    opacity: 0.95;
}

        /* 網頁內鬧鐘彈窗遮罩 */
        .alarm-modal-overlay {
            display: none;
            position: fixed;

        function playSplashAnimation() {
            const splash = document.getElementById('loadingSplash');

                splash.classList.add('shaki');

        function initFontThemes() {
            const savedTitle = localStorage.getItem(TITLE_FONT_KEY);
            if (savedTitle !== null) titleFontIdx = parseInt(savedTitle, 10) % titleFonts.length;
            applyFonts();
        }

        function cycleTitleFont() {
            titleFontIdx = (titleFontIdx + 1) % titleFonts.length;
            localStorage.setItem(TITLE_FONT_KEY, String(titleFontIdx));
            applyFonts();
        }

        function applyFonts() {
            const tFont = titleFonts[titleFontIdx];

            if (tBtn) tBtn.innerText = `🔤 標題：${tFont.label}`;

        function formatPower(num) {
            if (!num && num !== 0) return '--';
            if (num >= 1000000000) return (num / 1000000000).toFixed(2) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return String(num);
        }

        function getDisplayAccountName(accId) {
            return (profiles[accId] && profiles[accId].name) ? profiles[accId].name : accId;
        }

        async function fetchSingleProfile(accId) {
            const p = profiles[accId];
            if (!p || !p.queryName) return false;

            const targetUrl = `https://kingdom-1177.vercel.app/api/governor-profile?name=${encodeURIComponent(p.queryName)}&alliance=${encodeURIComponent(p.queryAlliance || '')}`;
            const candidateUrls = [
                targetUrl,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (const url of candidateUrls) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (data && data.ok && data.governor) {
                        const gov = data.governor;
                        profiles[accId] = {
                            ...profiles[accId],
                            name: gov.name || p.queryName,
                            alliance: gov.alliance || p.queryAlliance,
                            levelLabel: gov.levelLabel || (gov.tg ? `TG${gov.tg}` : `Lv.${gov.townCenter || ''}`),
                            power: gov.power || 0,
                            powerRank: gov.powerRank || null,
                            avatar: gov.avatar || profiles[accId].avatar,
                            lastFetched: new Date().toISOString()
                        };
                        return true;
                    }
                } catch (e) {}
            }
            return false;
        }

        async function refreshAllProfiles(silent = false) {
            const btn = document.getElementById('refreshProfileBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerText = '⏳ 同步中...';
            }

            const results = await Promise.all([
                fetchSingleProfile('z'),
                fetchSingleProfile('h'),
                fetchSingleProfile('p')
            ]);

            if (results.some(ok => ok)) {
                saveProfiles();
                renderGrid();
                updateTimeline();
            } else if (!silent) {
                alert('暫時無法連線至遊戲資料接口，請稍後再試（已保留上次同步的資料）。');
            }

            if (btn) {
                btn.disabled = false;
                btn.innerText = '🔄 刷新戰力';
            }
        }

        function editAccountQuery(accId) {
            const cur = profiles[accId];
            const newName = prompt(`修改 [${accId.toUpperCase()}] 的遊戲角色名稱（需與遊戲內完全一致）：`, cur.queryName);
            if (newName === null) return;
            const trimmedName = newName.trim();
            if (!trimmedName) return;

            const newAlliance = prompt(`修改 [${trimmedName}] 的聯盟標籤（例如 TER 或 777）：`, cur.queryAlliance || '');
            if (newAlliance === null) return;

            profiles[accId].queryName = trimmedName;
            profiles[accId].queryAlliance = newAlliance.trim();
            profiles[accId].name = trimmedName;
            profiles[accId].alliance = newAlliance.trim();
            saveProfiles();
            renderGrid();
            refreshAllProfiles(false);
        }

        function saveProfiles() {
            try {
                localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profiles));
            } catch (e) {}
            profileDbRef.set(profiles).catch(err => console.error("Profile Sync Error:", err));
        }

        function loadLocalProfiles() {
            try {
                const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    accounts.forEach(acc => {
                        if (parsed[acc.id]) {
                            profiles[acc.id] = { ...profiles[acc.id], ...parsed[acc.id] };
                        }
                    });
                }
            } catch (e) {}
        }

        function setupProfileListener() {
            profileDbRef.on("value", (snapshot) => {
                const cloudProfiles = snapshot.val();
                if (cloudProfiles) {
                    accounts.forEach(acc => {
                        if (cloudProfiles[acc.id]) {
                            profiles[acc.id] = { ...profiles[acc.id], ...cloudProfiles[acc.id] };
                        }
                    });
                    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profiles));
                    renderGrid();
                    updateTimeline();
                } else {
                    saveProfiles();
                }
            });
        }

        function startBackgroundWorker() {
            try {
                const workerCode = `setInterval(function() { postMessage('tick'); }, 1000);`;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));
                worker.onmessage = function() { updateTimers(); };
            } catch (e) {
                setInterval(updateTimers, 1000);
            }
        }

        function pruneUnstartedDrafts() {
            let changed = false;
            accounts.forEach(acc => {
                ['soldiers', 'tech', 'master', 'sunlight'].forEach(type => {
                    const list = store[acc.id][type] || [];
                    const running = list.filter(i => i.endTime !== null);
                    const unstarted = list.filter(i => i.endTime === null);

                    if (unstarted.length > 1) {
                        const firstDraft = unstarted[0];
                        if (type === 'soldiers' || type === 'tech') {
                            firstDraft.d = 0;
                            firstDraft.h = 0;
                            firstDraft.m = 0;
                        }
                        store[acc.id][type] = [...running, firstDraft];
                        changed = true;
                    } else if (unstarted.length === 0 && running.length === 0) {
                        let defD = 0, defH = 0, defM = 0;
                        if (type === 'master') defM = 10;
                        if (type === 'sunlight') defH = 8;
                        store[acc.id][type] = [{ id: ++nextId, d: defD, h: defH, m: defM, endTime: null }];
                        changed = true;
                    }
                });
            });
            return changed;
        }

        function init() {
            playSplashAnimation();
            initFontThemes();
            loadLocalBackup();
            pruneUnstartedDrafts();
            loadLocalProfiles();
            updateSunlightBtnUI();
            renderGrid();
            setupFirebaseRealtimeListener();
            setupProfileListener();
            startBackgroundWorker();
            refreshAllProfiles(true);
        }

        function setupFirebaseRealtimeListener() {
            const badge = document.getElementById('syncBadge');

            dbRef.on("value", (snapshot) => {
                const cloudData = snapshot.val();
                badge.innerText = "🟢 雲端已同步";
                badge.className = "sync-badge connected";

                if (cloudData && cloudData.store) {
                    applySerializedState(cloudData);
                    if (!hasPrunedInitialDrafts) {
                        hasPrunedInitialDrafts = true;
                        if (pruneUnstartedDrafts()) {
                            saveState();
                        }
                    }
                    saveLocalBackup();
                    updateSunlightBtnUI();
                    renderGrid();
                    updateTimeline();
                } else if (!isInitialLoadDone) {
                    saveState();
                }
                isInitialLoadDone = true;
            }, (error) => {
                badge.innerText = "🔴 雲端連線異常";
                badge.className = "sync-badge error";
                console.error("Firebase Error:", error);
            });
        }

        function serializeState() {
            const serializedStore = {};
            accounts.forEach(acc => {
                const accData = store[acc.id];
                serializedStore[acc.id] = {
                    soldiers: (accData.soldiers || []).map(i => ({ ...i, endTime: i.endTime ? i.endTime.toISOString() : null })),
                    tech: (accData.tech || []).map(i => ({ ...i, endTime: i.endTime ? i.endTime.toISOString() : null })),
                    master: (accData.master || []).map(i => ({ ...i, endTime: i.endTime ? i.endTime.toISOString() : null })),
                    sunlight: (accData.sunlight || []).map(i => ({ ...i, endTime: i.endTime ? i.endTime.toISOString() : null })),
                    soldierJobTime: accData.soldierJobTime || '',
                    soldierJobDate: accData.soldierJobDate ? accData.soldierJobDate.toISOString() : null,
                    techJobTime: accData.techJobTime || '',
                    techJobDate: accData.techJobDate ? accData.techJobDate.toISOString() : null
                };
            });

            return {
                store: serializedStore,
                nextId: nextId,
                showSunlightEvent: showSunlightEvent,
                triggered: Array.from(triggeredEventKeys),
                updatedAt: Date.now()
            };
        }

        function applySerializedState(parsed) {
            if (!parsed || !parsed.store) return;
            accounts.forEach(acc => {
                const incoming = parsed.store[acc.id] || {};
                ['soldiers', 'tech', 'master', 'sunlight'].forEach(type => {
                    const list = incoming[type] ? Object.values(incoming[type]) : [];
                    store[acc.id][type] = list.map(item => ({
                        ...item,
                        endTime: item.endTime ? new Date(item.endTime) : null
                    }));
                });
                store[acc.id].soldierJobTime = incoming.soldierJobTime || '';
                store[acc.id].soldierJobDate = incoming.soldierJobDate ? new Date(incoming.soldierJobDate) : null;
                store[acc.id].techJobTime = incoming.techJobTime || '';
                store[acc.id].techJobDate = incoming.techJobDate ? new Date(incoming.techJobDate) : null;
            });

            if (parsed.nextId) nextId = parsed.nextId;
            if (typeof parsed.showSunlightEvent === 'boolean') showSunlightEvent = parsed.showSunlightEvent;
            if (parsed.triggered) triggeredEventKeys = new Set(Object.values(parsed.triggered));
        }

        function saveState() {
            const payload = serializeState();
            saveLocalBackup(payload);

            const badge = document.getElementById('syncBadge');
            badge.innerText = "🔄 同步中...";
            dbRef.set(payload)
                .then(() => {
                    badge.innerText = "🟢 雲端已同步";
                    badge.className = "sync-badge connected";
                })
                .catch(err => {
                    badge.innerText = "🔴 寫入失敗";
                    badge.className = "sync-badge error";
                });
        }

        function saveLocalBackup(payloadObj) {
            try {
                const dataToSave = payloadObj || serializeState();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            } catch (e) {}
        }

        function loadLocalBackup() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    applySerializedState(JSON.parse(raw));
                }
            } catch (e) {}
        }

            showSunlightEvent = !showSunlightEvent;

        function updateSunlightBtnUI() {
            const btn = document.getElementById('sunlightToggleBtn');

            if (showSunlightEvent) {
                btn.innerText = "☀️ 沐光：顯示";

            } else {
                btn.innerText = "☀️ 沐光：隱藏";
                btn.classList.remove('active');
            }
        }

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeepOnce() {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;
                
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);
                gain1.gain.setValueAtTime(0.35, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.25);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1174.66, now + 0.18);
                gain2.gain.setValueAtTime(0.35, now + 0.18);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.18);
                osc2.stop(now + 0.55);
            } catch (e) {}
        }

                const height = 280;
                const left = (screen.width - width) / 2;
                const top = (screen.height - height) / 2;

                if (popupWin && !popupWin.closed) {

                    "GameAlarmPopup",

                if (popupWin) {

        function triggerAlarmAlert(eventKey, message) {
            if (triggeredEventKeys.has(eventKey)) return;
            triggeredEventKeys.add(eventKey);
            saveState();

            if (!activeAlerts.includes(message)) {
                activeAlerts.push(message);
            }

            const listEl = document.getElementById('alarmModalList');
            listEl.innerHTML = activeAlerts.map(msg => `<div>${msg}</div>`).join('');
            document.getElementById('alarmModalOverlay').style.display = 'flex';

            openForcedPopup(activeAlerts);

            try { window.focus(); } catch (e) {}
            if (!titleBlinkInterval) {
                let toggle = false;
                titleBlinkInterval = setInterval(() => {
                    document.title = toggle ? "【⏰ 時間到了！】" : "【🔔 快看鬧鐘！】";
                    toggle = !toggle;
                }, 600);
            }

            playBeepOnce();
            if (!ringInterval) {
                ringInterval = setInterval(playBeepOnce, 2000);
            }
        }

        function dismissAlarm() {
            document.getElementById('alarmModalOverlay').style.display = 'none';
            activeAlerts = [];

            if (popupWin && !popupWin.closed) {
                popupWin.close();
            }
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
            if (titleBlinkInterval) {
                clearInterval(titleBlinkInterval);
                titleBlinkInterval = null;
            }
            document.title = ORIGINAL_TITLE;

        function handleArrowNav(event, prevFieldId, nextFieldId, accId, type, id) {
            const parentCard = event.target.closest('.timer-card');
            if (event.key === 'Enter') {
                event.preventDefault();
                startTimer(accId, type, id);
                return;
            }
            if (event.key === 'ArrowLeft' && prevFieldId && parentCard) {
                event.preventDefault();
                const prevInput = parentCard.querySelector('#' + prevFieldId);
                if (prevInput) { prevInput.focus(); prevInput.select(); }
            }
            if (event.key === 'ArrowRight' && nextFieldId && parentCard) {
                event.preventDefault();
                const nextInput = parentCard.querySelector('#' + nextFieldId);
                if (nextInput) { nextInput.focus(); nextInput.select(); }
            }
        }

        function autoJumpOnNumber(event, currentInput, nextFieldId) {
            const isNumberKey = (event.key >= '0' && event.key <= '9');
            if (isNumberKey && currentInput.value.length >= 2 && nextFieldId) {
                const parentCard = currentInput.closest('.timer-card');
                if (parentCard) {
                    const nextInput = parentCard.querySelector('#' + nextFieldId);
                    if (nextInput) { nextInput.focus(); nextInput.select(); }
                }
            }
        }

        function formatPad(num) { return String(num).padStart(2, '0'); }
        function formatTimeHM(date) { return !date ? '--:--' : `${formatPad(date.getHours())}:${formatPad(date.getMinutes())}`; }
        function formatDateTime(date) { return !date ? '--:--' : `${date.getMonth() + 1}/${date.getDate()} ${formatTimeHM(date)}`; }

        function addItem(accId, type) {
            let defD = 0, defH = 0, defM = 0;
            if (type === 'master') { defM = 10; }
            else if (type === 'sunlight') { defH = 8; }

            store[accId][type].push({ id: ++nextId, d: defD, h: defH, m: defM, endTime: null });
            renderGrid();
        }

        function deleteItem(accId, type, id) {
            store[accId][type] = store[accId][type].filter(item => item.id !== id);
            renderGrid();
            recalculateJobs();
            saveState();
        }

        function startTimer(accId, type, id) {
            initAudioContext();
            const cardEl = document.getElementById(`card_${id}`);
            const item = store[accId][type].find(i => i.id === id);

            if (cardEl && item) {
                const inputD = cardEl.querySelector('.input-d');
                const inputH = cardEl.querySelector('.input-h');
                const inputM = cardEl.querySelector('.input-m');

                item.d = Math.max(0, inputD ? (parseInt(inputD.value, 10) || 0) : 0);
                item.h = Math.max(0, inputH ? (parseInt(inputH.value, 10) || 0) : 0);
                item.m = Math.max(0, inputM ? (parseInt(inputM.value, 10) || 0) : 0);

                const now = new Date();
                const totalSeconds = (item.d * 86400) + (item.h * 3600) + (item.m * 60);
                item.endTime = new Date(now.getTime() + totalSeconds * 1000);

                renderGrid();
                recalculateJobs();
                saveState();
            }
        }

        function editRunningTimer(accId, type, id) {
            const item = store[accId][type].find(i => i.id === id);
            if (item) {
                if (item.endTime) {
                    const diffSec = Math.max(0, Math.ceil((item.endTime - new Date()) / 1000));
                    item.d = Math.floor(diffSec / 86400);
                    item.h = Math.floor((diffSec % 86400) / 3600);
                    item.m = Math.floor((diffSec % 3600) / 60);
                }
                item.endTime = null;
                renderGrid();
                recalculateJobs();
                saveState();
            }
        }

        function updateTimers() {
            const now = new Date();
            const typeNames = {
                soldiers: '士兵訓練',
                tech: '科技研究',
                master: '📖 大師技能',
                sunlight: '☀️ 沐光之旅'
            };

            accounts.forEach(acc => {
                const displayName = getDisplayAccountName(acc.id);
                ['soldiers', 'tech', 'master', 'sunlight'].forEach(type => {
                    if (type === 'sunlight' && !showSunlightEvent) return;

                    const typeName = typeNames[type];
                    (store[acc.id][type] || []).forEach((item, idx) => {
                        if (item.endTime) {
                            const diff = Math.floor((item.endTime - now) / 1000);
                            const disp = document.getElementById(`disp_${item.id}`);
                            
                            if (diff <= 0) {
                                if (disp) disp.innerText = "00:00 (完結)";
                                const eventKey = `task_${item.id}_${item.endTime.getTime()}`;
                                triggerAlarmAlert(eventKey, `[${displayName}] ${typeName} #${idx + 1} 已經完成！`);
                            } else if (disp) {
                                const d = Math.floor(diff / 86400);
                                const h = Math.floor((diff % 86400) / 3600);
                                const m = Math.floor((diff % 3600) / 60);
                                const s = diff % 60;
                                disp.innerText = (d > 0 ? `${d}天 ` : '') + `${formatPad(h)}:${formatPad(m)}:${formatPad(s)}`;
                            }
                        }
                    });
                });

                if (store[acc.id].soldierJobDate && now >= store[acc.id].soldierJobDate) {
                    const jobKey = `job_s_${acc.id}_${store[acc.id].soldierJobDate.getTime()}`;
                    triggerAlarmAlert(jobKey, `[${displayName}] ⚔️ 士兵職位預約時間 (${store[acc.id].soldierJobTime}) 到了！`);
                }

                if (store[acc.id].techJobDate && now >= store[acc.id].techJobDate) {
                    const jobKey = `job_t_${acc.id}_${store[acc.id].techJobDate.getTime()}`;
                    triggerAlarmAlert(jobKey, `[${displayName}] 🔬 科技職位預約時間 (${store[acc.id].techJobTime}) 到了！`);
                }
            });

            checkExpiredJobsAndAutoUpdate();

            if (document.getElementById('timelineView').style.display === 'block') {
                updateTimeline();
            }
        }

        function checkExpiredJobsAndAutoUpdate() {
            const now = new Date();
            let needUpdate = false;

            accounts.forEach(acc => {
                ['soldierJobDate', 'techJobDate'].forEach(dateKey => {
                    if (store[acc.id][dateKey]) {
                        if (now - store[acc.id][dateKey] > 5 * 60 * 1000) {
                            const timeKey = dateKey.replace('Date', 'Time');
                            store[acc.id][timeKey] = '';
                            store[acc.id][dateKey] = null;
                            needUpdate = true;
                        }
                    }
                });
            });

            if (needUpdate) {
                recalculateJobs();
                saveState();
            }
        }

        function recalculateJobs() {
            const now = new Date();

            accounts.forEach(acc => {
                let futureSoldierEnds = (store[acc.id].soldiers || []).filter(i => i.endTime && i.endTime > now).map(i => i.endTime);
                if (futureSoldierEnds.length > 0) {
                    futureSoldierEnds.sort((a, b) => a - b);
                    const slotObj = calcRecommendedSlot(futureSoldierEnds[0]);
                    store[acc.id].soldierJobTime = slotObj.timeStr;
                    store[acc.id].soldierJobDate = slotObj.dateObj;
                } else {
                    store[acc.id].soldierJobTime = '';
                    store[acc.id].soldierJobDate = null;
                }

                let futureTechEnds = (store[acc.id].tech || []).filter(i => i.endTime && i.endTime > now).map(i => i.endTime);
                if (futureTechEnds.length > 0) {
                    futureTechEnds.sort((a, b) => a - b);
                    const slotObj = calcRecommendedSlot(futureTechEnds[0]);
                    store[acc.id].techJobTime = slotObj.timeStr;
                    store[acc.id].techJobDate = slotObj.dateObj;
                } else {
                    store[acc.id].techJobTime = '';
                    store[acc.id].techJobDate = null;
                }

                const sSelect = document.getElementById(`${acc.id}_soldier_job_select`);
                if (sSelect) sSelect.value = store[acc.id].soldierJobTime;

                const tSelect = document.getElementById(`${acc.id}_tech_job_select`);
                if (tSelect) tSelect.value = store[acc.id].techJobTime;
            });

            updateTimeline();
        }

        function calcRecommendedSlot(endTime) {
            const now = new Date();
            let slotDate = new Date(endTime);
            let h = slotDate.getHours();
            let m = slotDate.getMinutes();
            let slotH = h;
            let slotM = 0;

            if (m >= 50) {
                slotH = (h + 1) % 24;
                slotM = 0;
                if (slotH === 0) slotDate.setDate(slotDate.getDate() + 1);
            } else if (m >= 20) {
                slotM = 30;
            } else {
                slotM = 0;
            }

            slotDate.setHours(slotH, slotM, 0, 0);

            while (slotDate <= now) {
                slotDate = new Date(slotDate.getTime() + 30 * 60 * 1000);
            }

            const finalH = slotDate.getHours();
            const finalM = slotDate.getMinutes();

            return { timeStr: `${formatPad(finalH)}:${formatPad(finalM)}`, dateObj: slotDate };
        }

        function shiftJobTime(accId, type) {
            const timeKey = type === 'soldier' ? 'soldierJobTime' : 'techJobTime';
            const dateKey = type === 'soldier' ? 'soldierJobDate' : 'techJobDate';

            let curDate = store[accId][dateKey] || new Date();
            let newDate = new Date(curDate.getTime() + 30 * 60 * 1000);

            store[accId][dateKey] = newDate;
            store[accId][timeKey] = formatTimeHM(newDate);

            const selectId = `${accId}_${type}_job_select`;
            document.getElementById(selectId).value = store[accId][timeKey];
            updateTimeline();
            saveState();
        }

        function manualJobChange(accId, type, val) {
            const timeKey = type === 'soldier' ? 'soldierJobTime' : 'techJobTime';
            const dateKey = type === 'soldier' ? 'soldierJobDate' : 'techJobDate';

            store[accId][timeKey] = val;
            if (val) {
                const [h, m] = val.split(':').map(Number);
                let d = new Date();
                d.setHours(h, m, 0, 0);
                if (d < new Date()) d.setDate(d.getDate() + 1);
                store[accId][dateKey] = d;
            } else {
                store[accId][dateKey] = null;
            }
            updateTimeline();
            saveState();
        }

        function generateJobOptions(selectedVal) {
            let html = '<option value="">--無預約--</option>';
            for (let h = 0; h < 24; h++) {
                for (let m of [0, 30]) {
                    const timeStr = `${formatPad(h)}:${formatPad(m)}`;
                    const isSel = timeStr === selectedVal ? 'selected' : '';
                    html += `<option value="${timeStr}" ${isSel}>${timeStr}</option>`;
                }
            }
            return html;
        }

        function updateTimeline() {
            const tasksContainer = document.getElementById('timeline_tasks');
            const soldierJobsContainer = document.getElementById('timeline_soldier_jobs');
            const techJobsContainer = document.getElementById('timeline_tech_jobs');

            let tasksList = [];
            let soldierJobsList = [];
            let techJobsList = [];

            accounts.forEach(acc => {
                const displayName = getDisplayAccountName(acc.id);
                (store[acc.id].soldiers || []).forEach((item, idx) => {
                    if (item.endTime) {
                        tasksList.push({ acc: displayName, accId: acc.id, time: item.endTime, timeStr: formatDateTime(item.endTime), label: `士兵 #${idx + 1}`, tagClass: 'tag-soldier' });
                    }
                });
                (store[acc.id].tech || []).forEach((item, idx) => {
                    if (item.endTime) {
                        tasksList.push({ acc: displayName, accId: acc.id, time: item.endTime, timeStr: formatDateTime(item.endTime), label: `科技 #${idx + 1}`, tagClass: 'tag-tech' });
                    }
                });
                (store[acc.id].master || []).forEach((item, idx) => {
                    if (item.endTime) {
                        tasksList.push({ acc: displayName, accId: acc.id, time: item.endTime, timeStr: formatDateTime(item.endTime), label: `📖 大師技能 #${idx + 1}`, tagClass: 'tag-master' });
                    }
                });
                if (showSunlightEvent) {
                    (store[acc.id].sunlight || []).forEach((item, idx) => {
                        if (item.endTime) {
                            tasksList.push({ acc: displayName, accId: acc.id, time: item.endTime, timeStr: formatDateTime(item.endTime), label: `☀️ 沐光之旅 #${idx + 1}`, tagClass: 'tag-sunlight' });
                        }
                    });
                }

                if (store[acc.id].soldierJobDate) {
                    soldierJobsList.push({ acc: displayName, accId: acc.id, time: store[acc.id].soldierJobDate, timeStr: formatDateTime(store[acc.id].soldierJobDate), label: '⚔️ 士兵職位', tagClass: 'tag-job-s' });
                }
                if (store[acc.id].techJobDate) {
                    techJobsList.push({ acc: displayName, accId: acc.id, time: store[acc.id].techJobDate, timeStr: formatDateTime(store[acc.id].techJobDate), label: '🔬 科技職位', tagClass: 'tag-job-t' });
                }
            });

            tasksList.sort((a, b) => a.time - b.time);
            soldierJobsList.sort((a, b) => a.time - b.time);
            techJobsList.sort((a, b) => a.time - b.time);

            renderTimelineColumn(tasksContainer, tasksList, "無進行中計時");
            renderTimelineColumn(soldierJobsContainer, soldierJobsList, "無士兵職位預約");
            renderTimelineColumn(techJobsContainer, techJobsList, "無科技職位預約");
        }

        function renderTimelineColumn(container, list, emptyText) {
            if (!container) return;
            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#A38E7D; padding:15px; font-size:13px;">${emptyText}</div>`;
                return;
            }
            container.innerHTML = list.map(item => `
                <div class="timeline-item ${item.accId}">
                    <div>
                        <span style="font-size: 15px; margin-right: 4px;">[${item.acc}]</span>
                        <span class="tag ${item.tagClass}">${item.label}</span>
                    </div>
                    <div>${item.timeStr}</div>
                </div>
            `).join('');
        }

        function toggleView() {
            const grid = document.getElementById('gridView');
            const timeline = document.getElementById('timelineView');
            const btn = document.getElementById('toggleBtn');

            if (grid.style.display === 'none') {
                grid.style.display = 'grid';
                timeline.style.display = 'none';
                btn.innerHTML = '<img class="btn-icon-svg" src="./btn_change.svg" alt=""> 切換時間線';
            } else {
                grid.style.display = 'none';
                timeline.style.display = 'block';
                btn.innerHTML = '<img class="btn-icon-svg" src="./btn_change.svg" alt=""> 切換 3 欄視圖';
                updateTimeline();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
