<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多帳戶鬧鐘與職位助手</title>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        /* 載入所有自訂字體 */
        @font-face {
            font-family: 'MarshmallowFont';
            src: url('./HanyiSentyMarshmallow.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'DonutFont';
            src: url('./SentyDonut.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'MaokenFont';
            src: url('./MaokenAssortedSans-TC.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'HuninnFont';
            src: url('./jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'KoseFont';
            src: url('./Kosefont-JP.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'KosePFont';
            src: url('./KosefontP-JP.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            /* San-X 療癒可可棕主色調 */
            --cocoa: #5C3D2E;
            --cocoa-light: #8C6A58;
            --cream-bg: #FFFDF6;
            --dot-color: #F3E5C8;

            /* Howard：蘇打天空藍 */
            --bg-h: #EEF7FF;
            --border-h: #A6D4FA;
            --card-h: linear-gradient(135deg, #6EB5FF 0%, #5299E8 100%);
            --shadow-h: rgba(82, 153, 232, 0.25);

            /* Zoey：草莓櫻花粉 */
            --bg-z: #FFF0F4;
            --border-z: #F8B4C8;
            --card-z: linear-gradient(135deg, #FF7EA5 0%, #EB5A87 100%);
            --shadow-z: rgba(235, 90, 135, 0.25);

            /* Patrick：蜂蜜布丁黃 */
            --bg-p: #FFF9E2;
            --border-p: #F7D774;
            --card-p: linear-gradient(135deg, #F7B733 0%, #E69A15 100%);
            --shadow-p: rgba(230, 154, 21, 0.25);

            /* 預設字體組合 */
            --font-title: 'MaokenFont', 'HuninnFont', "PingFang HK", sans-serif;
            --font-body: 'HuninnFont', -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
            --font-num: 'HuninnFont', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        * {
            box-sizing: border-box;
        }

        /* San-X 風格奶油波點背景 */
        body {
            font-family: var(--font-body);
            background-color: var(--cream-bg);
            background-image:
                radial-gradient(var(--dot-color) 2.2px, transparent 2.2px),
                radial-gradient(#FCE8EC 2.2px, var(--cream-bg) 2.2px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
            margin: 0;
            padding: 22px 18px 40px 18px;
            color: var(--cocoa);
            -webkit-font-smoothing: antialiased;
        }

        button, select, input {
            font-family: var(--font-body);
            color: var(--cocoa);
        }

        /* 頂部可愛橫幅列 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1220px;
            margin: 0 auto 20px auto;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #F0DFC8;
            border-radius: 24px;
            box-shadow: 0 6px 18px rgba(92, 61, 46, 0.07);
            flex-wrap: wrap;
            gap: 10px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-mascot {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            animation: gentleFloat 3s ease-in-out infinite;
        }

        h1 {
            font-family: var(--font-title);
            font-weight: normal;
            font-size: 26px;
            margin: 0;
            letter-spacing: 1px;
            color: var(--cocoa);
        }

        .sync-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            background: #F5EFE6;
            color: var(--cocoa-light);
            border: 1.5px dashed #DECBB7;
        }
        .sync-badge.connected {
            background: #E8F8EC;
            color: #26733A;
            border-color: #A3DFB3;
        }
        .sync-badge.error {
            background: #FDECEA;
            color: #A62626;
            border-color: #F5B7B1;
        }

        .header-btns {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        /* 糖果膠囊按鈕 */
        .pill-btn {
            border: 2px solid #FFF;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12.5px;
            color: #FFF;
            box-shadow: 0 3px 8px rgba(92, 61, 46, 0.14);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
        }
        .pill-btn:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.04);
        }
        .pill-btn:active {
            transform: scale(0.97);
        }

        .btn-refresh-profile { background: linear-gradient(135deg, #5CD685, #38B864); }
        .btn-refresh-profile:disabled { opacity: 0.65; cursor: wait; }
        .btn-font-title { background: linear-gradient(135deg, #C07CEB, #A155D4); }
        .btn-font-body { background: linear-gradient(135deg, #7D83EB, #5D64D4); }
        .btn-test { background: linear-gradient(135deg, #FFAE42, #F28B18); }
        .btn-event-toggle { background: #B8A99A; }
        .btn-event-toggle.active { background: linear-gradient(135deg, #FF9966, #FF6B5B); }
        .btn-toggle { background: linear-gradient(135deg, #5AA9FF, #3B88E8); }

        /* 3欄手賬卡片視圖 */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            max-width: 1220px;
            margin: 0 auto;
        }

        .account-column {
            border-radius: 24px;
            padding: 16px;
            border: 3px solid #FFFFFF;
            box-shadow: 0 8px 22px rgba(92, 61, 46, 0.08);
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        /* 內層虛線手賬縫邊 */
        .account-column::before {
            content: "";
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 18px;
            border: 1.5px dashed rgba(92, 61, 46, 0.16);
            pointer-events: none;
        }

        .account-column.h { background-color: var(--bg-h); outline: 2px solid var(--border-h); }
        .account-column.z { background-color: var(--bg-z); outline: 2px solid var(--border-z); }
        .account-column.p { background-color: var(--bg-p); outline: 2px solid var(--border-p); }

        /* 角落角色插圖貼紙 */
        .corner-sticker {
            position: absolute;
            bottom: 8px;
            right: 10px;
            width: 58px;
            height: 58px;
            opacity: 0.88;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 2px 4px rgba(92, 61, 46, 0.15));
        }

        /* 遊戲角色名片貼紙 */
        .profile-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid rgba(92, 61, 46, 0.08);
            box-shadow: 0 4px 12px rgba(92, 61, 46, 0.06);
            position: relative;
            z-index: 2;
        }

        .profile-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            object-fit: cover;
            background: #F5EFE6;
            border: 2.5px solid #FFF;
            box-shadow: 0 3px 8px rgba(92, 61, 46, 0.15);
            display: block;
        }

        .avatar-mini-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 22px;
            height: 22px;
            background: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            box-shadow: 0 2px 4px rgba(92, 61, 46, 0.18);
        }

        .profile-details {
            flex: 1;
            min-width: 0;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .profile-name {
            font-family: var(--font-title);
            font-weight: normal;
            font-size: 24px;
            color: var(--cocoa);
            line-height: 1.15;
            letter-spacing: 0.5px;
        }

        .profile-alliance {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--cocoa);
            color: #FFFDF6;
        }

        .profile-stats-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
            flex-wrap: wrap;
            font-size: 12px;
            font-weight: 600;
        }

        .stat-pill {
            padding: 2px 9px;
            border-radius: 999px;
        }
        .stat-pill.tg {
            background: #E6F3FF;
            color: #2B6CB0;
            border: 1px solid #BEE3F8;
        }
        .stat-pill.power {
            background: #FFF2E2;
            color: #C05621;
            border: 1px solid #FBD38D;
        }

        .profile-meta {
            font-size: 11px;
            color: var(--cocoa-light);
            margin-top: 4px;
        }

        .btn-edit-profile {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #FAF4EB;
            border: 1px solid #EADBC8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn-edit-profile:hover { opacity: 1; transform: scale(1.1); }

        .section-block {
            position: relative;
            z-index: 2;
        }

        .section-header {
            font-family: var(--font-title);
            font-weight: normal;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
            color: var(--cocoa);
            padding: 0 2px;
        }

        .btn-add {
            background: #5CD685;
            color: white;
            border: 2px solid #FFF;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(92, 61, 46, 0.15);
            transition: transform 0.2s;
        }
        .btn-add:hover { transform: scale(1.15); }

        /* 軟萌計時小卡片 */
        .timer-card {
            color: white;
            border-radius: 16px;
            padding: 11px 12px;
            margin-bottom: 9px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.65);
            position: relative;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .timer-card:hover {
            transform: translateY(-2px);
        }

        .h .timer-card { background: var(--card-h); box-shadow: 0 4px 12px var(--shadow-h); }
        .z .timer-card { background: var(--card-z); box-shadow: 0 4px 12px var(--shadow-z); }
        .p .timer-card { background: var(--card-p); box-shadow: 0 4px 12px var(--shadow-p); }

        .timer-card.master-card {
            border-left: 6px solid #FFF3A1;
        }
        .timer-card.sunlight-card {
            background: linear-gradient(135deg, #FFA24C 0%, #FF6F61 100%) !important;
            box-shadow: 0 4px 12px rgba(255, 111, 97, 0.28) !important;
            border-left: 6px solid #FFF6D6;
        }

        .timer-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .timer-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .timer-title {
            font-size: 12px;
            opacity: 0.95;
            font-weight: 600;
        }

        .timer-display {
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-num);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(92, 61, 46, 0.18);
        }

        .timer-sub {
            font-size: 11px;
            opacity: 0.9;
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
        }

        .time-input {
            width: 27px;
            height: 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            font-family: var(--font-num);
            color: var(--cocoa);
            padding: 0;
        }

        .timer-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.28);
            border: 1.5px solid rgba(255, 255, 255, 0.55);
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn-action:hover { background: rgba(255, 255, 255, 0.45); }

        .btn-del {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            cursor: pointer;
            padding: 0 3px;
        }
        .btn-del:hover { color: white; }

        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.45);
        }

        .btn-preset {
            background: rgba(92, 61, 46, 0.22);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-preset:hover {
            background: rgba(255, 255, 255, 0.38);
        }

        /* 職位預約白卡 */
        .job-section {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            border: 2px solid rgba(92, 61, 46, 0.08);
            box-shadow: 0 4px 10px rgba(92, 61, 46, 0.05);
            position: relative;
            z-index: 2;
        }

        .job-section-title {
            font-family: var(--font-title);
            font-weight: normal;
            font-size: 18px;
            border-bottom: 1.5px dashed #E6D7C3;
            padding-bottom: 5px;
            color: var(--cocoa);
        }

        .job-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--cocoa);
        }

        .btn-shift {
            background: #FFA24C;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 4px;
        }
        .btn-shift:hover { background: #EB8931; }

        select {
            padding: 4px 8px;
            border-radius: 999px;
            border: 1.5px solid #DFCBB5;
            background: #FFFDF9;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--cocoa);
        }

        /* 打直獨立拆分欄位視圖 */
        .timeline-view {
            display: none;
            max-width: 1220px;
            margin: 0 auto;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .timeline-column {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 16px;
            border: 2px solid #F0DFC8;
            box-shadow: 0 6px 18px rgba(92, 61, 46, 0.07);
        }

        .timeline-column h3 {
            font-family: var(--font-title);
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 19px;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px dashed #EFE2D0;
            color: var(--cocoa);
        }

        .timeline-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 9px;
            border-radius: 14px;
            border-left: 6px solid;
            font-weight: 600;
            font-size: 13.5px;
            color: var(--cocoa);
        }

        .timeline-item.h { background-color: var(--bg-h); border-color: var(--border-h); }
        .timeline-item.z { background-color: var(--bg-z); border-color: var(--border-z); }
        .timeline-item.p { background-color: var(--bg-p); border-color: var(--border-p); }

        .tag {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            color: white;
            margin-left: 4px;
        }
        .tag-soldier { background: #FF9F43; }
        .tag-tech { background: #7D83EB; }
        .tag-master { background: #5CD685; }
        .tag-sunlight { background: #FF6F61; }
        .tag-job-s { background: #EB5A87; }
        .tag-job-t { background: #5299E8; }

        /* 網頁內鬧鐘彈窗遮罩 */
        .alarm-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 61, 46, 0.55);
            backdrop-filter: blur(3px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
        }

        .alarm-modal {
            background: #FFFDF8;
            border-radius: 26px;
            padding: 28px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 18px 40px rgba(92, 61, 46, 0.28);
            border: 4px solid #FFB3C6;
            animation: bounceIn 0.3s ease;
        }

        .alarm-modal-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: inline-block;
            animation: ring 0.8s infinite;
        }

        .alarm-modal h2 {
            font-family: var(--font-title);
            font-weight: normal;
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #E04F7B;
        }

        .alarm-modal-list {
            background: #FFF5F7;
            border: 1.5px dashed #F8B4C8;
            border-radius: 14px;
            padding: 12px;
            margin: 15px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--cocoa);
            max-height: 200px;
            overflow-y: auto;
        }

        .alarm-modal-list div {
            padding: 6px 0;
            border-bottom: 1px dashed #F3D1DC;
        }
        .alarm-modal-list div:last-child { border-bottom: none; }

        .btn-dismiss {
            background: linear-gradient(135deg, #FF7EA5, #EB5A87);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(235, 90, 135, 0.3);
        }
        .btn-dismiss:hover { filter: brightness(1.05); }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        @keyframes ring {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.85); }
            100% { transform: scale(1); }
        }

        @media (max-width: 950px) {
            .grid-view, .timeline-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-group">
            <!-- 可愛原創小熊鬧鐘 SVG 徽章 -->
            <svg class="header-mascot" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="18" r="9" fill="#C68B59" stroke="#5C3D2E" stroke-width="3"/>
                <circle cx="16" cy="18" r="4.5" fill="#F7D5B4"/>
                <circle cx="48" cy="18" r="9" fill="#C68B59" stroke="#5C3D2E" stroke-width="3"/>
                <circle cx="48" cy="18" r="4.5" fill="#F7D5B4"/>
                <ellipse cx="32" cy="36" rx="22" ry="19" fill="#D99B66" stroke="#5C3D2E" stroke-width="3"/>
                <ellipse cx="32" cy="41" rx="9" ry="7" fill="#FFF8EE"/>
                <circle cx="24" cy="33" r="2.6" fill="#5C3D2E"/>
                <circle cx="40" cy="33" r="2.6" fill="#5C3D2E"/>
